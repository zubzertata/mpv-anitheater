# ==========================================
# uosc.conf - Modern Glass & Clean UI Theme
# ==========================================

# Display
scale=1.0
font_scale=1.0
autohide=yes

# --- TOP BAR (Window Controls: Minimize, Maximize, Close) ---
top_bar=no-border
top_bar_size=40
top_bar_controls=right
top_bar_title=yes
top_bar_alt_title=${filename}
top_bar_alt_title_place=toggle
top_bar_flash_on=video,audio
top_bar_persistency=
window_border_size=1

# --- TIMELINE (Smooth, Solid Bar - No Fragmented Lines) ---
timeline_style=bar
timeline_size=20
timeline_line_width=0
timeline_border=0
timeline_cache=no
timeline_heatmap=none
progress=never
destination_time=playtime-remaining
chapter_ranges=openings:22c55eb0,endings:a855f7b0,ads:c54e4e80
chapter_range_patterns=openings:オープニング,opテーマ,主題歌;endings:エンディング,edテーマ,結び

# --- CONTROLS LAYOUT (Clean, Perfectly Symmetric & Center-Aligned) ---
# Left (5 items): Master Menu, Subtitles/Translation, Audio, Repeat, Shuffle
# Center: Previous Chapter, Prev, Play/Pause, Next, Next Chapter
# Right (5 items): Speed, Screenshot, Playlist, Info/Stats, Fullscreen
controls=menu,subtitles,audio,cycle:repeat_one:loop-file:no/inf!?Repetir Archivo,toggle:shuffle:shuffle?Mezclar Lista,space,<has_chapter>command:fast_rewind:add chapter -1?Capítulo Anterior,prev,play-pause,next,<has_chapter>command:fast_forward:add chapter 1?Siguiente Capítulo,space,command:speed:script-message toggle-speed-popover?Ajustar Velocidad,command:photo_camera:async screenshot?Captura de Pantalla,playlist,command:info:script-binding stats/display-stats-toggle?Estadísticas e Información,fullscreen

# --- VOLUME (Minimalist, Sleek & Non-intrusive) ---
volume=right
volume_size=28
volume_border=1
volume_step=2
volume_persistency=

# --- BEHAVIOR ---
languages=slang,es,spa,en,eng,jpn,ja
subtitles_directory=~~/subtitles
load_types=video,audio
adjust_osd_margins=yes
default_directory=~/
flash_duration=1800
show_hidden_files=no

# --- VISUALS & LEGIBILITY (Reduced Transparency & Sharp Typography) ---
border_radius=8
text_border=2.0
menu_item_height=40
menu_min_width=320
pause_indicator=flash

opacity=menu=0.88,submenu=0.90,curtain=0.15,timeline=0.6,position=1,chapters=0.6,slider=0.4,slider_gauge=1,controls=0.05,speed=0.94,title=0.4,tooltip=1,thumbnail=1,idle_indicator=0.8,audio_indicator=0.5,buffering_indicator=0.3,playlist_position=0.8
color=foreground=ffffff,foreground_text=000000,background=101218,background_text=ffffff,curtain=000000,success=ffffff,error=ff4444
