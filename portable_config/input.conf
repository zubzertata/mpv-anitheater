###########
#  Mouse  #
###########
MOUSE_BTN0     cycle pause
MOUSE_BTN0_DBL cycle fullscreen
MOUSE_BTN2     script-binding uosc/menu
WHEEL_UP       no-osd add volume  2 ; script-binding uosc/flash-volume
WHEEL_DOWN     no-osd add volume -2 ; script-binding uosc/flash-volume

##############
# Navigation #
##############
RIGHT       seek  5 relative+keyframes
LEFT        seek -5 relative+keyframes
SHIFT+RIGHT seek  1 relative+exact
SHIFT+LEFT  seek -1 relative+exact
UP          no-osd add volume  2 ; script-binding uosc/flash-volume
DOWN        no-osd add volume -2 ; script-binding uosc/flash-volume
SPACE       cycle pause
f           cycle fullscreen
ESC         set fullscreen no
q           quit-watch-later

####################
# Custom Dashboard #
####################
TAB         script-message open-dashboard
T           script-message open-subtitles-menu
c           script-message open-subtitles-menu

####################
# Media Controls   #
####################
a           cycle audio
s           cycle sub
v           cycle sub-visibility
CTRL+s      cycle secondary-sid
m           script-message toggle-audio-spatial
n           script-message toggle-audio-night
b           script-message toggle-video-mode
e           script-message toggle-eco-mode
E           script-message open-equalizer-menu
V           script-message cycle-volume-boost
B           script-message open-controls-customizer
l           script-message cycle-ab-loop
L           script-message clear-ab-loop

# Sync
[           add sub-delay -0.1
]           add sub-delay +0.1
{           add audio-delay -0.1
}           add audio-delay +0.1

# Quality & Utility
F5          screenshot video
i           script-binding stats/display-stats-toggle
MBTN_RIGHT  script-binding uosc/menu
MENU        script-binding uosc/menu
