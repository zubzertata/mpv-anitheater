###########
# General #
###########
vo=gpu-next
gpu-api=auto
hwdec=auto-safe
border=no
autofit-larger=100%x95%
save-position-on-quit=yes
keep-open=yes
prefetch-playlist=yes
watch-later-directory=~~/watch_later
watch-later-options=start,vid,aid,sid
gpu-shader-cache-dir=~~/cache/shaders
cursor-autohide=1000

#############
# Rendering #
#############
profile=high-quality
scale=spline64
cscale=spline64
dscale=spline64
correct-downscaling=yes
linear-downscaling=no
sigmoid-upscaling=yes
dither-depth=auto
dither=fruit
deband=no
deband-iterations=2
deband-threshold=35
deband-range=20
deband-grain=6

#########
# Audio #
#########
audio-channels=auto-safe
volume-max=150
volume=100

##############################
# Subtitles (Signature Look) #
##############################
demuxer-mkv-subtitle-preroll=yes
demuxer-mkv-subtitle-preroll-secs=2
sub-auto=fuzzy
sub-file-paths-append=ass:srt:sub:subs:subtitles
sub-font="Hey Comic"
embeddedfonts=yes
sub-fonts-dir=~~/fonts
sub-fix-timing=no
sub-use-margins=yes
sub-ass-force-margins=yes
sub-ass-override=force
sub-ass-style-overrides=blur=1
sub-ass-use-video-data=all
blend-subtitles=no
sub-gauss=0.9
sub-blur=0.9
sub-gray=yes
sub-scale-with-window=yes
sub-font-size=40
sub-color="#B5FFFFFF"
sub-border-color="#AA000080"
sub-shadow-color="#AA000000"
sub-border-size=3
sub-shadow-offset=3
sub-spacing=0.5
sub-pos=100
image-subs-video-resolution=yes
stretch-image-subs-to-screen=yes

#############
# Languages #
#############
alang=ja,jpn,es-419,spa,es,ko
slang=es-419,es-LA,spa,es,en
track-auto-selection=yes
subs-fallback-forced=no
subs-match-os-language=no
subs-with-matching-audio=yes

################################
# OSD / Notifications (UX/UI)  #
################################
osd-bar=no
osd-font="Segoe UI"
osd-font-size=22
osd-color="#FFFFFFFF"
osd-border-color="#DD101218"
osd-border-size=1.8
osd-shadow-offset=1.0
osd-shadow-color="#40000000"
osd-align-x=center
osd-align-y=top
osd-margin-y=24
osd-duration=2000

#########
# Cache #
#########
cache=yes
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=256MiB
